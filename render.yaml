services:
  - type: web
    name: gaytak-api
    runtime: node
    plan: free
    buildCommand: |
      npx pnpm install --frozen-lockfile --ignore-scripts
      cd artifacts/api-server && npx pnpm exec node build.mjs
    startCommand: cd artifacts/api-server && node dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080

  - type: static
    name: gaytak-marketplace
    plan: free
    buildCommand: |
      npx pnpm install --frozen-lockfile --ignore-scripts
      cd artifacts/marketplace && PORT=3000 BASE_PATH=/ npx pnpm exec vite build --config vite.config.ts
    staticPublishPath: artifacts/marketplace/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gaytak-api.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html
